name: openbiz
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openbiz}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    networks: [backend]
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command: ["--providers.docker=true","--providers.docker.exposedbydefault=false","--entrypoints.web.address=:80","--entrypoints.websecure.address=:443","--api.dashboard=true"]
    ports: ["80:80","443:443"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [edge]
  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5}
    restart: unless-stopped
    command: server
    environment: &authentik_env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-openbiz}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB:-openbiz}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [edge,backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentik.rule=Host(`auth.${OPENBIZ_DOMAIN}`)
      - traefik.http.routers.authentik.entrypoints=web
      - traefik.http.services.authentik.loadbalancer.server.port=9000
  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5}
    restart: unless-stopped
    command: worker
    environment:
      <<: *authentik_env
      AUTHENTIK_BOOTSTRAP_PASSWORD_HASH: ${AUTHENTIK_BOOTSTRAP_PASSWORD_HASH:-}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    volumes: [authentik_media:/media,authentik_templates:/templates]
  control-plane:
    build: ./control-plane
    restart: unless-stopped
    environment:
      OPENBIZ_TOOL_GATEWAY_URL: http://tool-gateway:8080
      OPENBIZ_LITELLM_URL: http://litellm:4000
      OPENBIZ_LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      OPENBIZ_AUTH_URL: http://authentik-server:9000
    networks: [edge,backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.openbiz.rule=Host(`openbiz.${OPENBIZ_DOMAIN}`)
      - traefik.http.routers.openbiz.entrypoints=web
      - traefik.http.services.openbiz.loadbalancer.server.port=3000
  tool-gateway:
    build: ./core/tool-gateway
    restart: unless-stopped
    networks: [backend]
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes: [uptime_data:/app/data]
    networks: [edge,backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`status.${OPENBIZ_DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=web
      - traefik.http.services.uptime.loadbalancer.server.port=3001
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      N8N_HOST: ${N8N_HOST}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-openbiz}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-openbiz}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [n8n_data:/home/node/.n8n]
    networks: [edge,backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${N8N_HOST}`)
      - traefik.http.routers.n8n.entrypoints=web
      - traefik.http.services.n8n.loadbalancer.server.port=5678
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment: {QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}}
    volumes: [qdrant_data:/qdrant/storage]
    networks: [backend]
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    networks: [backend]
    profiles: [local-ai]
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    command: ["--config","/app/config.yaml","--port","4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes: ["./core/ai/litellm-config.yaml:/app/config.yaml:ro"]
    networks: [backend]
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config","/etc/livekit.yaml"]
    environment: {LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"}
    volumes: ["./voice/livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880","7881:7881","50000-50100:50000-50100/udp"]
    networks: [edge,backend]
  voice-agent:
    build: ./voice/agent
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      OPENBIZ_LITELLM_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENBIZ_TOOL_GATEWAY_URL: http://tool-gateway:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: [livekit,litellm,tool-gateway]
    networks: [backend]
networks:
  edge:
  backend: {internal: true}
volumes:
  postgres_data:
  redis_data:
  uptime_data:
  n8n_data:
  qdrant_data:
  ollama_data:
  authentik_media:
  authentik_templates:
